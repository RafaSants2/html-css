<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exercício</h1>

    <form autocomplete="off" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="texto">Nome completo: </label>
                <input type="text" id="texto" required placeholder="name">
            </p>
            <p>
                <label for="idade">Idade: </label>
                <input type="number" name="idade" id="idade" required min="18" max="70" placeholder="entre 18 a 70 anos">
            </p>
            <p>
                <label for="Data">Data de nascimento: </label>
                <input type="date" name="" id="Data" required autocomplete="bday-month">
            </p>
        </fieldset>

        <fieldset>
            <legend>Dados Complementares</legend>
            <p>
                <label for="gmail">E-mail: </label>
                <input type="email" id="gmail" required autocomplete="email">
            </p>
            <p>
                <label for="senha">Senha: </label>
                <input type="password" id="senha" required placeholder="entre 5 a 8 caracteres" minlength="5" maxlength="8" autocomplete="current-password">
            </p>
        </fieldset>

        <fieldset>
            <legend>Campos/Dados Opcionais</legend>
            <p>
                <label for="tel">Telefone: </label>
                <input type="tel" id="tel" placeholder="Opcional" autocomplete="tel-national">
            </p>
            <p>
                <label for="hora">Hora atual: </label>
                <input type="time" id="hora">
            </p>
        </fieldset>
    </form>
</body>
</html>
