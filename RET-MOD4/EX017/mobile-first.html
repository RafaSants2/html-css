<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile first</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <h1>Iniciando um site Mobile First</h1>
        <img src="imagens/icon-phone.png" alt="" id="phone">
        <img src="imagens/icon-tablet.png" alt="" id="tablet">
        <img src="imagens/icon-print.png" alt="" id="print">
        <img src="imagens/icon-pc.png" alt="" id="pc">
        <img src="imagens/icon-tv.png" alt="" id="tv">
    </main>

<!--
    O que é Mobile First?
        -> Método criado com o intuito de, ao invés de começar a fazer o site com a tela de um pc/notebook, fariamos a versão móvel/mobile primeiro, ademais, isso trás algumas vantagens, sendo elas:
            Facilidade na divulgação do seu site;
            Melhoria na experiência do usuário;
            Melhoria na credibilidade;

    Device breakpoints
        -> Se usa para definir o tamanho de uma tela.
-->
</body>
</html>
