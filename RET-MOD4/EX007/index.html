<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Métodos GET e POST</h1>

    <form autocomplete="off" method="post">
        <p>
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome">
        </p>

        <input type="submit" value="Enviar">
    </form>

    <!--
        - method PADRÃO get: onde mostra na barra de pesquisas os dados
        - method post: oculta na barra de pesquisa seus dados 

        OBS: usa-se o atributo "method" na tag "form".
    -->
</body>
</html>
