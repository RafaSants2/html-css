<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/empe.css" media="screen" and (orientation: portrait)>
    <link rel="stylesheet" href="estilos/deitado.css" media="screen" and (orientation: landscape)>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
<!--
        O que é?
            - As Media Queries são um recurso do CSS que permite mudar a aparência de um site dependendo das características da tela do dispositivo, principalmente a largura, tudo isso para que o site seja responsivo.

        media ->
            atributo usado no "link css". se você colocar nesse atributo "screen", as configurações com css serão só aplicadas á tela, se você usar "print", ai será só aplicada á impressora, e se colcoar "all", será para todos os tipos em media.

        media features -> é a característica de telas, com ela, posso deixar meu site responsivo para um notebook, PC, celular etc.
    -->
</html>
