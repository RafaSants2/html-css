<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Formulario com Label</h1>
    <p>Lo primero que debes hacer es usar la tag "<strong>form</strong>" para crear un formulario con un "input" dentro.</p>
    <form autocomplete="off" action="cadastro.js">
        <p><label for="Nome">Nome:</label> 
            <input type="text" name="Nome" id="Nome"> </p>
        <p><label for="sobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="sobrenome"></p>
        <input type="submit" value="Enviar">
    </form>

    <!--
        Se usa "form" para decir que quieres crear un formulario, además, también se usa un "input" con varios tipos, como por ejemplo: "text", "button", "subtmit"...

        autocomplete: off : con ese atributo en "form", puedo desactivar las sugerencias al escribir algo en las cajas (de nombres, correos electronicos, etc...)

        label: se usa en un local con "for", donde se pone nuestro id localizado en los input's.
    -->
</body>
</html>
